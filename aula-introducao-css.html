<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste</title>

    <style>
        p, div {
            color: black;
            border: 1px dashed #444200;
            border-radius: 5px 10px;
            margin: 5px;
        }

        p a {
            color: whitesmoke;
        }

        a {
            text-decoration: none;
        }

        .engsof {
            width: 200px;
            margin: auto;
        }

        div {
            font-size: 20px;
        }

        #css {
            border: 2px dotted red;
        }

        div:hover {
            background-color: blue;
            font-size: 24px;
            cursor: grab;
        }
    </style>
</head>

<body>
    <a href="https://unicid.edu.br" target="_blank">siga</a>

    <p style="padding: 10px; background-color: antiquewhite;">
        Aula 01
        <a href="https://unicid.edu.br" target="_blank">siga</a>
    </p>

    <p class="engsof presencial">Aula 02 - HTML</p>

    <p class="engsof" id="css">Aula 03 - CSS</p>

    <div>Aula 04</div>

    <p style="padding: 10px; background-color: antiquewhite;">
        Aula 05
    </p>
</body>
</html>
